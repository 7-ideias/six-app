name: Temporary Flutter PR Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  full-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Run production web build script
        run: bash scripts/build_web_with_public_home.sh
