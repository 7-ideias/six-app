name: Temporary Mobile Visual Assets Validation

on:
  push:
    branches:
      - feature/20261001-mobile-imagens-vendas-gestao

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/presentation/models/mobile_business_visual_assets.dart lib/presentation/controllers/mobile_business_visual_context_controller.dart lib/presentation/components/mobile/six_mobile_rotating_intro_card.dart lib/presentation/screens/opcoes_venda_mobile_screen.dart lib/presentation/screens/gestao_mobile_screen.dart test/presentation/models/mobile_business_visual_assets_test.dart
      - name: Analyze changed files
        run: flutter analyze lib/presentation/models/mobile_business_visual_assets.dart lib/presentation/controllers/mobile_business_visual_context_controller.dart lib/presentation/components/mobile/six_mobile_rotating_intro_card.dart lib/presentation/screens/opcoes_venda_mobile_screen.dart lib/presentation/screens/gestao_mobile_screen.dart
      - name: Run focused tests
        run: |
          flutter test test/presentation/models/mobile_business_visual_assets_test.dart
          flutter test test/presentation/screens/gestao_mobile_screen_test.dart
      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=https://api.sixappback.com
