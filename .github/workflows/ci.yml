name: Flutter CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable

      - name: Exibir versão do Flutter
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Observação sobre deploy Vercel
        run: |
          echo "O deploy Web da Vercel não é executado por este workflow do GitHub Actions."
          echo "A Vercel usa sua própria configuração de CI/CD definida em vercel.json."
          echo "installCommand: bash install_flutter.sh"
          echo "buildCommand: export PATH=\"\$PWD/flutter/bin:\$PATH\" && flutter --version && flutter pub get && flutter gen-l10n && flutter build web --release"
          echo "outputDirectory: build/web"

