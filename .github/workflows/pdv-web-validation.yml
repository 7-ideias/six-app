name: Seletor de itens do PDV Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/presentation/components/web/pdv_seletor_itens_web.dart'
      - 'lib/presentation/screens/produto_lista_sub_painel_web.dart'
      - 'lib/core/utils/produto_helper.dart'
      - 'test/presentation/screens/produto_lista_sub_painel_web_test.dart'
      - '.github/workflows/pdv-web-validation.yml'

permissions:
  contents: read

jobs:
  seletor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib/presentation/components/web/pdv_seletor_itens_web.dart
      - name: Testar seleção, permissões, filtros e revisão do PDV
        run: >-
          flutter test --no-pub --reporter expanded
          --name 'PDV|seletor|selecao web|dialogo de selecao'
          test/presentation/screens/produto_lista_sub_painel_web_test.dart
      - name: Comparar os testes de edição na base do PR
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base-pdv" "$BASE_SHA"
          cd "$RUNNER_TEMP/base-pdv"
          flutter pub get
          flutter test --no-pub --reporter expanded --name 'lista web filtra por busca|catalogo web renderiza' test/presentation/screens/produto_lista_sub_painel_web_test.dart
