name: Aplicar consulta de vendas Flutter

on:
  pull_request:
    branches:
      - main
    paths:
      - '.consulta-vendas-flutter-payload/**'
      - '.github/workflows/apply-consulta-vendas-flutter-payload.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo da branch da feature
        uses: actions/checkout@v4
        with:
          ref: feature/20260820-melhorias
          fetch-depth: 0

      - name: Reconstruir implementacao
        shell: bash
        run: |
          set -euo pipefail
          cat .consulta-vendas-flutter-payload/part.* | base64 --decode > /tmp/consulta-vendas-flutter.tar.gz
          echo '74f4e1a63b9de2577a6922bafc2ae9005fd5b35b49cd9ac093dafde6ad557eee  /tmp/consulta-vendas-flutter.tar.gz' | sha256sum --check --strict
          tar -tzf /tmp/consulta-vendas-flutter.tar.gz >/dev/null
          tar -xzf /tmp/consulta-vendas-flutter.tar.gz
          git diff --check

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Formatar arquivos alterados
        shell: bash
        run: |
          dart format \
            lib/data/models/consulta_vendas_models.dart \
            lib/data/services/vendas/consulta_vendas_api_client.dart \
            lib/presentation/layouts/authenticated_web_shell.dart \
            lib/presentation/navigation/web_navigation_destination_resolver.dart \
            lib/presentation/navigation/web_navigation_item.dart \
            lib/presentation/navigation/web_navigation_permission_adapter.dart \
            lib/presentation/navigation/web_navigation_registry.dart \
            lib/presentation/screens/consulta_vendas_web_page.dart

      - name: Obter dependencias
        run: flutter pub get

      - name: Compilar Flutter Web
        run: flutter build web --release --no-pub

      - name: Criar commit da implementacao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao de implementacao encontrada.'
            exit 0
          fi
          git commit -m 'feat(vendas): adicionar consulta web com filtros e detalhes'
          git push origin "HEAD:feature/20260820-melhorias"
