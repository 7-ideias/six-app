name: Temporary Atendimento Fallback Flutter Validation
# branch-only validation

on:
  push:
    branches:
      - feature/20261003-atendimento-fallback-backend

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/data/models/atendimento_mobile_assets_model.dart lib/core/services/perfil_negocio_service.dart lib/presentation/screens/atendimento_mobile_screen.dart test/data/models/atendimento_mobile_assets_model_test.dart
      - name: Analyze changed files
        run: flutter analyze lib/data/models/atendimento_mobile_assets_model.dart lib/core/services/perfil_negocio_service.dart lib/presentation/screens/atendimento_mobile_screen.dart
      - name: Run focused tests
        run: flutter test test/data/models/atendimento_mobile_assets_model_test.dart
      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=https://api.sixappback.com
