name: SixoApp iOS - TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sixoapp-ios-testflight-publish
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.4"
  IOS_SCHEME: Runner
  IOS_WORKSPACE: ios/Runner.xcworkspace
  IOS_EXPORT_OPTIONS: ios/ExportOptions.plist
  IOS_BUNDLE_ID: com.sixoapp.app
  IOS_TEAM_ID: 7FH3353D87
  IOS_PROVISIONING_PROFILE_NAME: SixoApp App Store
  IOS_CODE_SIGN_IDENTITY: Apple Distribution

jobs:
  publish-testflight:
    name: Build and upload iOS to TestFlight
    runs-on: macos-latest
    timeout-minutes: 90
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'chore(version):') &&
       !contains(join(github.event.commits.*.message, ' '), '[skip ios]') &&
       !contains(join(github.event.commits.*.message, ' '), '[web only]'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          required_vars=(
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_API_PRIVATE_KEY
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64
          )

          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              echo "::error::GitHub secret ausente: ${var_name}"
              exit 1
            fi
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve build configuration
        run: |
          set -euo pipefail
          python3 scripts/ci/resolve_ios_testflight_build_config.py

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          xcodebuild -version

      - name: Resolve Flutter dependencies
        run: |
          set -euo pipefail
          flutter pub get
          flutter precache --ios

      - name: Ensure CocoaPods is available
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          if [[ -f Podfile.lock ]]; then
            pod install --deployment
          else
            pod install
          fi

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          api_key_root="${HOME}/.appstoreconnect"
          api_key_dir="${api_key_root}/private_keys"
          api_key_path="${api_key_dir}/AuthKey_${APPLE_API_KEY_ID}.p8"

          mkdir -p "${api_key_dir}"
          chmod 700 "${api_key_root}" "${api_key_dir}"
          printf '%s' "${APPLE_API_PRIVATE_KEY}" > "${api_key_path}"
          chmod 600 "${api_key_path}"

          echo "APP_STORE_CONNECT_API_KEY_PATH=${api_key_path}" >> "${GITHUB_ENV}"

      - name: Install signing assets
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          cert_path="${RUNNER_TEMP}/ios_distribution.p12"
          profile_path="${RUNNER_TEMP}/sixoapp.mobileprovision"
          installed_profile_dir="${HOME}/Library/MobileDevice/Provisioning Profiles"
          keychain_path="${RUNNER_TEMP}/sixoapp-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"

          CERT_PATH="${cert_path}" \
          PROFILE_PATH="${profile_path}" \
          IOS_DISTRIBUTION_CERTIFICATE_BASE64="${IOS_DISTRIBUTION_CERTIFICATE_BASE64}" \
          IOS_PROVISIONING_PROFILE_BASE64="${IOS_PROVISIONING_PROFILE_BASE64}" \
          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["IOS_DISTRIBUTION_CERTIFICATE_BASE64"])
          )
          Path(os.environ["PROFILE_PATH"]).write_bytes(
              base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE_BASE64"])
          )
          PY

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db
          security default-keychain -d user -s "${keychain_path}"

          security import "${cert_path}" \
            -k "${keychain_path}" \
            -P "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"

          mkdir -p "${installed_profile_dir}"
          profile_uuid="$(
            security cms -D -i "${profile_path}" | \
            plutil -extract UUID raw -o - -
          )"
          installed_profile_path="${installed_profile_dir}/${profile_uuid}.mobileprovision"
          cp "${profile_path}" "${installed_profile_path}"

          echo "IOS_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"
          echo "IOS_CERTIFICATE_PATH=${cert_path}" >> "${GITHUB_ENV}"
          echo "IOS_PROFILE_PATH=${profile_path}" >> "${GITHUB_ENV}"
          echo "IOS_PROFILE_UUID=${profile_uuid}" >> "${GITHUB_ENV}"
          echo "IOS_INSTALLED_PROFILE_PATH=${installed_profile_path}" >> "${GITHUB_ENV}"

      - name: Prepare Flutter iOS build artifacts
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --build-name "${FLUTTER_BUILD_NAME}" \
            --build-number "${FLUTTER_BUILD_NUMBER}" \
            --dart-define="API_BASE_URL=${API_BASE_URL}" \
            --dart-define="PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL}" \
            --dart-define="APP_VERSION=${APP_VERSION}" \
            --dart-define="APP_BUILD_NUMBER=${APP_BUILD_NUMBER}" \
            --dart-define="GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID}"

      - name: Archive signed iOS app
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/Runner.xcarchive"

          xcodebuild \
            -workspace "${IOS_WORKSPACE}" \
            -scheme "${IOS_SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${archive_path}" \
            FLUTTER_BUILD_NAME="${FLUTTER_BUILD_NAME}" \
            FLUTTER_BUILD_NUMBER="${FLUTTER_BUILD_NUMBER}" \
            archive

          echo "IOS_ARCHIVE_PATH=${archive_path}" >> "${GITHUB_ENV}"

      - name: Export IPA
        run: |
          set -euo pipefail

          export_path="${RUNNER_TEMP}/ios-export"

          xcodebuild -exportArchive \
            -archivePath "${IOS_ARCHIVE_PATH}" \
            -exportPath "${export_path}" \
            -exportOptionsPlist "${IOS_EXPORT_OPTIONS}"

          ipa_path="$(find "${export_path}" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "::error::Nenhum arquivo .ipa foi gerado"
            exit 1
          fi

          echo "IPA path: ${ipa_path}"
          echo "IOS_EXPORT_PATH=${export_path}" >> "${GITHUB_ENV}"
          echo "IOS_IPA_PATH=${ipa_path}" >> "${GITHUB_ENV}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sixoapp-ios-ipa-${{ github.run_number }}
          path: ${{ env.IOS_IPA_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Validate IPA with App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            --type ios \
            --file "${IOS_IPA_PATH}" \
            --apiKey "${APPLE_API_KEY_ID}" \
            --apiIssuer "${APPLE_API_ISSUER_ID}"
          echo "IPA validation: success"

      - name: Upload IPA to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "${IOS_IPA_PATH}" \
            --apiKey "${APPLE_API_KEY_ID}" \
            --apiIssuer "${APPLE_API_ISSUER_ID}"
          echo "IPA upload: success"

      - name: Cleanup temporary signing assets
        if: always()
        run: |
          set +e

          if [[ -n "${APP_STORE_CONNECT_API_KEY_PATH:-}" ]]; then
            rm -f "${APP_STORE_CONNECT_API_KEY_PATH}"
          fi

          if [[ -n "${IOS_INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "${IOS_INSTALLED_PROFILE_PATH}"
          fi

          if [[ -n "${IOS_CERTIFICATE_PATH:-}" ]]; then
            rm -f "${IOS_CERTIFICATE_PATH}"
          fi

          if [[ -n "${IOS_PROFILE_PATH:-}" ]]; then
            rm -f "${IOS_PROFILE_PATH}"
          fi

          if [[ -n "${IOS_ARCHIVE_PATH:-}" ]]; then
            rm -rf "${IOS_ARCHIVE_PATH}"
          fi

          if [[ -n "${IOS_EXPORT_PATH:-}" ]]; then
            rm -rf "${IOS_EXPORT_PATH}"
          fi

          if [[ -n "${IOS_KEYCHAIN_PATH:-}" ]]; then
            security default-keychain -d user -s login.keychain-db || true
            security list-keychains -d user -s login.keychain-db || true
            security delete-keychain "${IOS_KEYCHAIN_PATH}" || true
          fi
