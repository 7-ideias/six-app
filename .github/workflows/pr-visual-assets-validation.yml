name: Temporary Visual Assets Validation
# branch-only validation; remove before merge

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Run focused tests
        run: |
          flutter test test/presentation/admin/admin_visual_assets_catalog_test.dart
          flutter test test/presentation/admin/admin_visual_assets_navigation_test.dart
          flutter test test/presentation/navigation/admin_route_decision_test.dart
      - name: Build Web
        run: flutter build web --release --no-wasm-dry-run --dart-define=API_BASE_URL=https://api.sixappback.com
