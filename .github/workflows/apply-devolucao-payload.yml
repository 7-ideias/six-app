name: Aplicar jornada de devolucao

on:
  push:
    branches:
      - feature/20260820-melhorias
    paths:
      - '.six-payload/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo da branch da feature
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconstruir arquivos da implementacao
        shell: bash
        run: |
          set -euo pipefail
          cat .six-payload/part.* | base64 --decode > /tmp/six-return-files.tar.gz
          sha256sum /tmp/six-return-files.tar.gz
          tar -tzf /tmp/six-return-files.tar.gz >/dev/null
          tar -xzf /tmp/six-return-files.tar.gz
          git diff --check

      - name: Criar commit da implementacao
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao de implementacao encontrada.'
            exit 0
          fi
          git commit -m 'feat(devolucao): integrar jornada web e mobile'
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"
